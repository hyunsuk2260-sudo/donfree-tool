<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 흰색 배경 (둥근 모서리) -->
  <rect width="100" height="100" rx="20" fill="#ffffff"/>
  
  <g transform="translate(15, 20)">
    <!-- 모니터 테두리 -->
    <rect x="0" y="0" width="70" height="46" rx="6" fill="none" stroke="#16a34a" stroke-width="5.5"/>
    
    <!-- 모니터 스탠드 및 받침대 -->
    <rect x="30" y="46" width="10" height="8" fill="#16a34a"/>
    <rect x="20" y="54" width="30" height="5" rx="2.5" fill="#16a34a"/>
    
    <!-- 내부 4개의 그리드 창 -->
    <rect x="15" y="11" width="16" height="10" rx="2" fill="#16a34a"/>
    <rect x="39" y="11" width="16" height="10" rx="2" fill="#16a34a"/>
    <rect x="15" y="26" width="16" height="10" rx="2" fill="#16a34a"/>
    <rect x="39" y="26" width="16" height="10" rx="2" fill="#16a34a"/>
  </g>
</svg>
