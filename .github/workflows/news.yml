name: Fetch Latest News
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 우회 API를 통해 뉴스 다운로드 및 저장
        run: |
          python -c "
          import urllib.request, json, os
          
          # 구글 직접 접속을 피하고, rss2json 우회 통로를 이용합니다.
          url = 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fnews.google.com%2Frss%3Fhl%3Dko%26gl%3DKR%26ceid%3DKR%3Ako'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          
          try:
              res = urllib.request.urlopen(req).read()
              data = json.loads(res)
              
              if 'items' in data:
                  # 뉴스 7개 추출
                  items = [{'title': i['title'].split(' - ')[0], 'link': i['link']} for i in data['items'][:7]]
                  os.makedirs('assets', exist_ok=True)
                  with open('assets/news.json', 'w', encoding='utf-8') as f:
                      json.dump(items, f, ensure_ascii=False)
                  print('뉴스 7개 저장 성공!')
              else:
                  print('뉴스를 찾지 못했습니다.')
          except Exception as e:
              print('수집 중 에러 발생:', e)
          "

      - name: 깃허브에 파일 업로드 (에러 방지 튼튼한 로직)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/news.json
          
          # 변경사항이 있는지 확인하고, 있을 때만 안전하게 푸시합니다.
          if git diff --staged --quiet; then
            echo "새로 업데이트할 뉴스가 없습니다."
          else
            git commit -m 'Update news successfully'
            git push
          fi
